[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monarch-os"
version = "1.1.0"
description = "Monarch OS v1.1 — a working implementation of the cognitive pipeline (Intake -> Vajra -> Caveman -> QA -> Ship)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
keywords = ["monarch", "cognitive-architecture", "llm", "pipeline", "compression"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
claude = ["anthropic"]

[project.scripts]
monarch = "monarch.cli:main"
shadow-os = "shadow_os.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["monarch", "shadow_os", "kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
