[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monarch-os"
version = "4.0.0"
description = "Monarch OS — local runtime with the Shadow OS capability-first cognitive engine operating within it"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
keywords = ["monarch", "shadow-os", "cognitive-architecture", "agents", "llm"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
claude = ["anthropic"]

[project.scripts]
monarch-os = "monarchos.cli:main"
shadow-os = "shadow_os.cli:main"
monarch = "monarch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["monarchos", "shadow_os", "kernel", "monarch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
